<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>流译</title>
  </head>
  <body>
    <header>
      <span class="popup-brand" aria-hidden="true">译</span>
      <span class="title">流译</span>
      <span class="dot" id="dot"></span>
      <span class="muted small" id="version"></span>
      <span class="grow"></span>
      <button class="ghost small theme-toggle" id="toggleTheme" type="button" aria-label="切换为深色界面"><svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z" /></svg><svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" /></svg></button>
      <button class="ghost small" id="openOptions"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 3 1-1h4l1 1 1 3 3 1 2 3v4l-2 3-3 1-1 3-1 1h-4l-1-1-1-3-3-1-2-3v-4l2-3 3-1z" /><circle cx="12" cy="12" r="3" /></svg>设置</button>
    </header>

    <section id="body">
      <div id="banner" class="banner hidden" role="status"></div>

      <div class="video">
        <div id="videoTitle" class="video-title">未在 YouTube 视频页</div>
        <div id="videoMeta" class="muted small"></div>
      </div>

      <div class="quick">
        <div class="field">
          <label class="label" for="sourceLang">原文语言</label>
          <select id="sourceLang"></select>
        </div>
        <div class="field">
          <label class="label" for="targetLang">翻译成</label>
          <select id="targetLang"></select>
        </div>
      </div>

      <section id="homeOverview" class="home-overview hidden" aria-label="功能概览">
        <div class="section-caption">核心翻译</div>
        <div class="mode-grid">
          <button type="button" id="homeOpenLive" class="mode-tile" data-mode="live">
            <span class="mode-tile-head"><span class="mode-dot"></span><strong>1. 直播实时翻译</strong><span class="mode-tile-go">设置 ›</span></span>
            <span id="homeLiveDesc" class="mode-tile-desc">实时抓取直播音频流</span>
          </button>
          <button type="button" id="homeOpenVideo" class="mode-tile" data-mode="video">
            <span class="mode-tile-head"><span class="mode-dot"></span><strong>2. 视频翻译</strong><span class="mode-tile-go">设置 ›</span></span>
            <span id="homeVideoDesc" class="mode-tile-desc">云端转写 / 字幕轨 + 整片翻译</span>
          </button>
        </div>
        <div class="section-caption">其它功能</div>
        <div class="other-chips">
          <button type="button" id="homeOpenText" class="ghost small">聊天与评论 ›</button>
          <button type="button" id="homeOpenSpeech" class="ghost small">划词与朗读 ›</button>
        </div>
      </section>

      <div id="coreSectionLabel" class="section-caption hidden">核心翻译</div>

      <section id="vsBox" class="vs hidden">
        <div class="vs-head">
          <span class="vs-title"><span class="mode-dot mode-dot-video" aria-hidden="true"></span>视频翻译</span>
          <span id="vsState" class="muted small">—</span>
        </div>
        <div id="vsSourceRow" class="vs-source-row">
          <span id="vsSourcePill" class="vs-source-pill"></span>
          <select id="vsAsrModel" class="vs-model-select hidden" aria-label="VPS 转写模型"></select>
          <button id="openVideoOptions" class="ghost small text-settings-link" type="button">配置 ›</button>
        </div>
        <div class="vs-bar" id="vsProgressBar" role="progressbar" aria-label="视频翻译进度" aria-valuemin="0" aria-valuemax="100"><i id="vsProgress"></i></div>
        <div class="vs-actions">
          <button class="primary" id="vsStart">开始视频翻译</button>
          <button id="vsCancel" class="hidden">取消翻译</button>
          <button class="ghost hidden" id="vsToggle">隐藏字幕</button>
          <button class="ghost hidden" id="vsRetranslate">重新翻译</button>
        </div>
        <div id="vsHint" class="muted small"></div>
      </section>

      <section id="liveCard" class="live-card">
        <div id="liveCardHead" class="live-head">
          <span class="live-title"><span class="mode-dot mode-dot-live" aria-hidden="true"></span>直播实时翻译</span>
          <button id="openLiveOptions" class="ghost small text-settings-link" type="button">设置 ›</button>
        </div>
        <button class="primary toggle" id="toggle">开始实时翻译</button>
        <button class="ghost toggle secondary hidden" id="liveToggleCaptions">隐藏直播字幕</button>

        <div id="liveDetails" class="hidden">
          <div class="stats">
            <div class="stat connection"><span class="muted">状态</span><span id="stConn" aria-live="polite">—</span></div>
            <div class="stat"><span class="muted">方向</span><span id="stDir">—</span></div>
            <div class="stat"><span class="muted">本场配置</span><span id="stContext">—</span></div>
            <div class="stat"><span class="muted">已运行</span><span id="stTime">—</span></div>
          </div>

          <div class="level-wrap">
            <span class="muted small">输入音量</span>
            <div class="level"><i id="level"></i></div>
          </div>
        </div>

        <button class="ghost small hidden" id="restart">应用当前设置并重新开始</button>
      </section>

      <button class="toggle hidden" id="reloadPage">刷新页面，重新连接插件</button>

      <div id="otherSectionLabel" class="section-caption hidden">其它功能</div>

      <section id="textBox" class="text-box hidden">
        <div class="text-head">
          <span>聊天与评论</span>
          <button id="openTextOptions" class="ghost small text-settings-link" type="button">设置 ›</button>
        </div>
        <label class="text-check" id="chatToggleRow"><input type="checkbox" id="chatTranslationToggle" role="switch" /><span>弹幕自动翻译</span></label>
        <div id="chatPrepareActions" class="chat-actions hidden">
          <button id="prepareChatTranslation" class="small">准备本地翻译</button>
          <span id="chatPrepareProgress" class="muted small" role="status"></span>
        </div>
        <label class="text-check" id="commentToggleRow"><input type="checkbox" id="commentTranslationToggle" role="switch" /><span>评论区翻译</span></label>
        <div id="commentActions" class="text-actions hidden">
          <button id="translateVisibleComments" class="small">翻译当前可见评论</button>
          <button id="cancelCommentTranslation" class="ghost small hidden">停止</button>
        </div>
        <div id="textState" class="muted small" role="status"></div>
      </section>

      <details id="contextBox" class="context-box hidden">
        <summary>本场背景与术语补充</summary>
        <div class="field temp">
          <textarea id="tempContext" rows="2" aria-label="本场补充"
            placeholder="补充本场游戏、人物名称或固定译法（换视频自动清空）…"></textarea>
          <div id="tempHint" class="muted small"></div>
        </div>
        <div class="context-actions">
          <button id="previewContext" class="small">AI 提炼背景与术语</button>
          <button id="copyContext" class="ghost small" disabled>复制</button>
        </div>
        <div id="contextState" class="muted small" role="status"></div>
        <div id="contextContent" class="hidden">
          <label class="label" for="generatedContext">AI 提炼结果</label>
          <textarea id="generatedContext" rows="4" readonly></textarea>
          <details class="generator-input">
            <summary>底层发送配置（调试）</summary>
            <p id="contextEffect" class="muted small"></p>
            <label id="effectivePromptLabel" class="label" for="effectivePrompt">本场翻译配置</label>
            <textarea id="effectivePrompt" rows="5" readonly></textarea>
            <label class="label" for="generatorPrompt">整理模型的输入提示词</label>
            <textarea id="generatorPrompt" rows="5" readonly aria-label="整理模型的输入提示词"></textarea>
          </details>
        </div>
      </details>

      <div id="hint" class="muted small"></div>

    </section>

    <script src="../common/constants.js"></script>
    <script src="../common/settings.js"></script>
    <script src="theme.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
